name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Shell installer syntax
        run: sh -n scripts/install.sh scripts/uninstall.sh scripts/install-adb.sh init/S99zzalice-ha-fastcommands
      - name: PowerShell installer syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/install-adb.ps1)) | Out-Null'
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: ARM64 build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o /tmp/alice-ha-fastcommands .
      - name: Binary self-test
        run: go run . --self-test
